name: Build ACE-Step RunPod Worker

on:
  push:
    paths:
      - "runpod_handlers/**"
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./runpod_handlers
          file: ./runpod_handlers/Dockerfile
          push: true
          tags: ghcr.io/razasheikhpak/ace-step:latest
